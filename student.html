<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD-Student</title>
    <!-- css -->
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <header>
      <nav class="container">
        <h3 class="logo"><a href="./index.html">Users</a></h3>

        <div class="links">
          <a class="link" href="">Student</a>
          <a class="link" href="">Users</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="c-user-container">
        <div class="c-users container">
            <button class="add-users">Talaba qo'shish</button>
        </div>
        </section>
      <section class="users-wrapper">
        <div class="container users-container">
          
        </div>
      </section>

      <div class="modal-overlay hidden" id="studentModal">
  <div class="modal">
    <div class="modal__header">
      <h2 class="modal__title">Yangi talaba qo'shish</h2>
      <button type="button" class="modal__close" aria-label="Yopish">&times;</button>
    </div>

    <form class="modal__form" id="addStudentForm">
      <div class="modal__field">
        <label class="modal__label" for="studentFullName">Ism va familiya</label>
        <input class="modal__input" type="text" id="studentFullName" name="fullName" placeholder="Masalan: Ali Valiyev" required>
      </div>

      <div class="modal__field">
        <label class="modal__label" for="studentAge">Yosh</label>
        <input class="modal__input" type="number" id="studentAge" name="age" min="1" max="100" required>
      </div>

      <div class="modal__field">
        <label class="modal__label" for="studentCourse">Kurs</label>
        <input class="modal__input" type="text" id="studentCourse" name="course" placeholder="Masalan: Frontend Development" required>
      </div>

      <div class="modal__field">
        <label class="modal__label" for="studentGrade">Baho (0–100)</label>
        <input class="modal__input" type="number" id="studentGrade" name="grade" min="0" max="100" required>
      </div>

      <div class="modal__checkbox-group">
        <input class="modal__checkbox" type="checkbox" id="studentIsGraduated" name="isGraduated">
        <label class="modal__checkbox-label" for="studentIsGraduated">Kursni bitirgan</label>
      </div>

      <div class="modal__actions">
        <button  type="submit" class="modal__btn modal__btn--submit">Talabani saqlash</button>
      </div>
    </form>
  </div>
</div>
   
    </main>
    <script type="module" src="./student.js"></script>
  </body>
</html>
